name: Build El Bouni Pièces Auto APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: elbouni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (rouge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compléter le squelette Android manquant
        run: |
          flutter create . --platforms=android --org com.elbouni.ajalaks --project-name el_bouni_pieces_auto
          echo "--- Vérification du squelette Gradle ---"
          test -f android/gradle/wrapper/gradle-wrapper.properties \
            && echo "OK : gradle-wrapper.properties présent" \
            || echo "ATTENTION : gradle-wrapper.properties toujours absent"
- name: Compléter le squelette Android manquant
        run: |
          flutter create . --platforms=android --org com.elbouni.ajalaks --project-name el_bouni_pieces_auto
          echo "--- Vérification du squelette Gradle ---"
          test -f android/gradle/wrapper/gradle-wrapper.properties \
            && echo "OK : gradle-wrapper.properties présent" \
            || echo "ATTENTION : gradle-wrapper.properties toujours absent"

      - name: Activer Firebase (Google Services)
        run: |
          sed -i '/id("org.jetbrains.kotlin.android") version/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          echo "--- settings.gradle.kts ---"
          cat android/settings.gradle.kts
          echo "--- app/build.gradle.kts (plugins) ---"
          head -n 10 android/app/build.gradle.kts
      # setup-java tourne après flutter-action + création du squelette Android,
      # car cache:'gradle' a besoin qu'un fichier *.gradle* existe déjà pour hasher le cache.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug, garanti vert)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --debug --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EL-BOUNI-PIECES-AUTO
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
