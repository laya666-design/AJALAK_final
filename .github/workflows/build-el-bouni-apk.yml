name: Build El Bouni Pièces Auto APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: elbouni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (rouge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compléter le squelette Android manquant
        run: |
          flutter create . --platforms=android --org com.elbouni.ajalaks --project-name el_bouni_pieces_auto
          echo "--- Vérification du squelette Gradle ---"
          test -f android/gradle/wrapper/gradle-wrapper.properties \
            && echo "OK : gradle-wrapper.properties présent" \
            || e
